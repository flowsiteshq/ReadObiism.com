<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>OBI-ISM — Sign in</title><style>:root{--ink:#07090c;--gold:#e9c46a;--paper:#f7f1e4;--muted:#b9b4aa}*{box-sizing:border-box}body{margin:0;background:var(--ink);color:#fff;font-family:Inter,system-ui,sans-serif;min-height:100vh}.shell{display:grid;grid-template-columns:minmax(0,1fr) 480px;min-height:100vh}.intro{align-items:flex-start;background:linear-gradient(135deg,#080c12,#121923);display:flex;flex-direction:column;justify-content:center;padding:8vw}.intro h1{font-family:Georgia,serif;font-size:clamp(54px,8vw,110px);letter-spacing:-.08em;line-height:.82;margin:0}.intro h1 span{color:var(--gold)}.intro p{color:#d7d2c7;font-family:Georgia,serif;font-size:clamp(20px,2.4vw,32px);line-height:1.15;max-width:520px}.panel{align-self:center;background:var(--paper);color:var(--ink);margin:24px;padding:38px;max-width:480px}.panel h2{font-family:Georgia,serif;font-size:42px;letter-spacing:-.06em;margin:0 0 8px}.panel .sub{color:#615d55;font-size:14px;line-height:1.5;margin:0 0 26px}.tabs{display:flex;border-bottom:1px solid #d8cfbf;margin-bottom:24px}.tabs button{background:none;border:0;border-bottom:2px solid transparent;color:#766f63;cursor:pointer;font-weight:900;letter-spacing:.1em;padding:12px 8px}.tabs button.active{border-color:#a87918;color:#17140e}.field{display:block;font-size:10px;font-weight:900;letter-spacing:.12em;margin:16px 0 7px}.field input{background:#fffaf0;border:1px solid #cfc4b2;color:var(--ink);font:inherit;padding:14px;width:100%}.submit{background:var(--ink);border:0;color:var(--gold);cursor:pointer;font-size:11px;font-weight:900;letter-spacing:.12em;margin-top:22px;padding:17px;width:100%}.message{color:#7b2f23;font-size:12px;line-height:1.45;margin-top:15px}.back{color:#7c641e;display:inline-block;font-size:11px;font-weight:900;letter-spacing:.1em;margin-top:22px;text-decoration:none}@media(max-width:800px){.shell{display:block}.intro{min-height:35vh;padding:42px 28px}.intro p{font-size:22px}.panel{margin:0;max-width:none;padding:30px 25px}} </style></head><body><main class="shell"><section class="intro"><h1>OBI–<span>ISM</span></h1><p>Your private reading space for <em>Building a Just Society Through Character.</em></p></section><section class="panel"><h2 id="heading">Welcome back.</h2><p class="sub" id="sub">Sign in to continue to your protected edition. Your account remembers your access; your original device remains the only authorized reader.</p><div class="tabs"><button class="active" id="sign-tab" type="button">SIGN IN</button><button id="create-tab" type="button">CREATE ACCOUNT</button></div><form id="form"><label class="field">EMAIL<input id="email" type="email" autocomplete="email" required></label><label class="field">PASSWORD<input id="password" type="password" minlength="8" autocomplete="current-password" required></label><button class="submit" id="submit" type="submit">SIGN IN →</button><p class="message" id="message" aria-live="polite"></p></form><a class="back" href="/">← RETURN TO OBI-ISM</a></section></main><script>(()=>{let mode="login";const form=document.getElementById("form"),submit=document.getElementById("submit"),message=document.getElementById("message"),heading=document.getElementById("heading"),sub=document.getElementById("sub"),sign=document.getElementById("sign-tab"),create=document.getElementById("create-tab");const setMode=(next)=>{mode=next;sign.classList.toggle("active",mode==="login");create.classList.toggle("active",mode==="register");heading.textContent=mode==="login"?"Welcome back.":"Create your account.";sub.textContent=mode==="login"?"Sign in to continue to your protected edition. Your account remembers your access; your original device remains the only authorized reader.":"Create an account before purchase so your edition can be restored securely. Your password is stored as a one-way hash.";submit.textContent=mode==="login"?"SIGN IN →":"CREATE ACCOUNT →";document.getElementById("password").autocomplete=mode==="login"?"current-password":"new-password";message.textContent=""};sign.onclick=()=>setMode("login");create.onclick=()=>setMode("register");form.onsubmit=async(e)=>{e.preventDefault();message.textContent="";submit.disabled=true;submit.textContent="WORKING…";try{const response=await fetch(`/api/account/${mode}`,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({email:document.getElementById("email").value,password:document.getElementById("password").value})});const body=await response.json().catch(()=>({}));if(!response.ok)throw new Error(body.error||"We could not complete that request.");if(body.access&&body.sessionId)location.assign(`/reader.html?session_id=${encodeURIComponent(body.sessionId)}`);else if(body.access)location.assign("/reader.html");else location.assign("/?account=ready")}catch(error){message.textContent=error.message||"We could not complete that request."}finally{submit.disabled=false;submit.textContent=mode==="login"?"SIGN IN →":"CREATE ACCOUNT →"}}})();</script></body></html>
