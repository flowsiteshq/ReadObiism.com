<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>OBI-ISM - Reset password</title>
  <link rel="stylesheet" href="assets/css/custom/login-1.css">
  <link rel="stylesheet" href="assets/css/custom/toast.css">
</head>
<body>
  <main class="shell">
    <section class="intro">
      <h1>OBI-<span>ISM</span></h1>
      <p>Recover access to your private reading edition.</p>
    </section>
    <section class="panel">
      <h2 id="heading">Reset your password.</h2>
      <p class="sub" id="sub">Enter the email address on your reader account. We will send an 8-digit reset code.</p>
      <form id="forgot-form">
        <label class="field">EMAIL ADDRESS<input id="email" type="email" autocomplete="email" placeholder="you@example.com" required></label>
        <button class="submit" id="send-code" type="submit">SEND RESET CODE <svg class="arrow-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-2px"><path d="M5 12h14"></path><path d="M12 5l7 7-7 7"></path></svg></button>
        <p class="message" id="message" aria-live="polite"></p>
      </form>
      <form id="reset-form" hidden>
        <p class="sub" id="reset-email-label"></p>
        <label class="field">8-DIGIT CODE<input id="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{8}" maxlength="8" required></label>
        <label class="field">NEW PASSWORD<input id="new-password" type="password" minlength="8" maxlength="128" autocomplete="new-password" required></label>
        <label class="field">CONFIRM NEW PASSWORD<input id="confirm-password" type="password" minlength="8" maxlength="128" autocomplete="new-password" required></label>
        <button class="submit" id="reset-submit" type="submit">RESET PASSWORD <svg class="arrow-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-2px"><path d="M5 12h14"></path><path d="M12 5l7 7-7 7"></path></svg></button>
        <p class="message" id="reset-message" aria-live="polite"></p>
        <a class="forgot" id="different-email" href="/forgot-password">USE A DIFFERENT EMAIL</a>
      </form>
      <a class="back" href="/login">BACK TO SIGN IN</a>
    </section>
  </main>
  <script src="assets/js/custom/obi-api.js"></script>
  <script src="assets/js/custom/toast.js"></script>
  <script src="assets/js/custom/forgot-password.js?v=20261111-password-reset"></script>
  <script src="assets/js/custom/clean-url.js"></script>
</body>
</html>
